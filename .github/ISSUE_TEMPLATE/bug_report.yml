name: Bug Report
description: Report a bug or issue in Shops & Shadows
title: "Bug: "
labels: ["bug", "playtest"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "e.g. Game froze when I opened the shop after a dungeon run."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we recreate this bug?
      placeholder: |
        1. Start a dungeon run in Region 2
        2. Complete floor 1
        3. Open shop at camp
        4. Game freezes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: "The shop should have opened normally."

  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the bottom-right of the title screen.
      placeholder: "e.g. v0.3"

  - type: dropdown
    id: area
    attributes:
      label: Region / Area
      description: Where did the bug occur?
      options:
        - R1 - Thornhaven (Forest Haven)
        - R2 - Fungal Marsh
        - R3 - Sunken Shores
        - R4 - Ashen Highlands
        - R5 - Shattered Expanse
        - R6 - Necropolis Crypts
        - R7 - Fractured Realm
        - Title Screen
        - Town Hub
        - Combat
        - Menus / Settings
        - Other

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots here if you have them.
      placeholder: "Paste or drag images here."
