name: Feedback
description: Share your feedback about Shops & Shadows
title: "Feedback: "
labels: ["feedback", "playtest"]
body:
  - type: dropdown
    id: category
    attributes:
      label: What is your feedback about?
      options:
        - Combat
        - Town / Facilities
        - Dungeon
        - Equipment / Items
        - Heroes / Classes
        - UI / Controls
        - Balance / Difficulty
        - Story / Lore
        - Audio / Music
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what you think! What did you enjoy? What felt off?
      placeholder: "e.g. Combat feels satisfying but R3 boss is way too hard for the gear available."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion (optional)
      description: Any ideas for how we could improve this?
      placeholder: "e.g. Maybe lower the boss HP or add more healing consumables in R3 shops."
